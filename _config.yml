remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "contrast"
title: "bgjelic | Projects"
description: "GitHub project showcase"
url: "https://bgjelic.github.io"
repository: "bgjelic/bgjelic.github.io"
teaser: /assets/images/MainScreen.png
locale: en
plugins:
  - jekyll-include-cache
include:
  - _pages
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "projects"
author:
  name: "bgjelic"
  avatar: /assets/images/avatar.jpg
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bgjelic"
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bgjelic"
analytics:
  provider: false

atom_feed:
  hide: true
